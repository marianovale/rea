<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#111418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>Controle TV</title>
    <style>
      :root {
        --bg: #111418;
        --surface: #1b2027;
        --surface-2: #252c35;
        --border: #303843;
        --text: #e8ecf1;
        --muted: #8b95a3;
        --accent: #4f8cff;
        --accent-text: #fff;
        --ok: #3ecf8e;
        --bad: #ff5d5d;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        padding: env(safe-area-inset-top) 16px
          calc(16px + env(safe-area-inset-bottom));
        max-width: 480px;
        margin: 0 auto;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
        touch-action: manipulation;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 0 10px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .dot.on {
        background: var(--ok);
      }
      .dot.off {
        background: var(--bad);
      }
      #device {
        flex: 1;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon-btn {
        background: var(--surface);
        border-radius: 12px;
        padding: 8px 12px;
        color: var(--muted);
      }

      #connect {
        display: none;
        gap: 8px;
        margin-bottom: 12px;
      }
      #connect.open {
        display: flex;
      }
      input {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        min-width: 0;
        flex: 1;
        user-select: text;
      }
      .primary {
        background: var(--accent);
        color: var(--accent-text);
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 600;
      }

      nav {
        display: flex;
        background: var(--surface);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 16px;
      }
      nav button {
        flex: 1;
        padding: 8px;
        border-radius: 9px;
        background: none;
        color: var(--muted);
        font-weight: 600;
      }
      nav button.active {
        background: var(--surface-2);
        color: var(--text);
      }
      section[hidden] {
        display: none;
      }

      .row {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
      }
      .r4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .r5 {
        grid-template-columns: repeat(5, 1fr);
      }
      .r3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .key {
        background: var(--surface);
        border-radius: var(--radius);
        height: 54px;
        font-size: 20px;
        display: grid;
        place-items: center;
        transition:
          transform 0.06s,
          background 0.06s;
      }
      .r5 .key {
        letter-spacing: -0.12em;
        font-size: 16px;
      }
      .key small {
        font-size: 11px;
        color: var(--muted);
        display: block;
        margin-top: -2px;
      }
      .key:active,
      .key.pressed {
        transform: scale(0.94);
        background: var(--surface-2);
      }
      .key.power {
        color: var(--bad);
      }

      .dpad {
        position: relative;
        width: min(300px, 78vw);
        aspect-ratio: 1;
        margin: 6px auto 20px;
        border-radius: 50%;
        background: var(--surface);
      }
      .dpad .key {
        position: absolute;
        background: transparent;
        border-radius: 50%;
        width: 33%;
        height: 33%;
        font-size: 26px;
        color: var(--muted);
      }
      .dpad .key:active,
      .dpad .key.pressed {
        background: var(--surface-2);
        color: var(--text);
      }
      .dpad [data-key="up"] {
        top: 2%;
        left: 33.5%;
      }
      .dpad [data-key="down"] {
        bottom: 2%;
        left: 33.5%;
      }
      .dpad [data-key="left"] {
        left: 2%;
        top: 33.5%;
      }
      .dpad [data-key="right"] {
        right: 2%;
        top: 33.5%;
      }
      .dpad [data-key="ok"] {
        top: 31%;
        left: 31%;
        width: 38%;
        height: 38%;
        background: var(--surface-2);
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
      }
      .dpad [data-key="ok"]:active,
      .dpad [data-key="ok"].pressed {
        background: var(--accent);
      }

      .rocker {
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        background: var(--surface);
        border-radius: var(--radius);
      }
      .rocker .key {
        background: none;
      }
      .rocker span {
        text-align: center;
        font-size: 11px;
        color: var(--muted);
      }
      .rockers {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .typing {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .typing .key {
        width: 54px;
        flex: none;
      }

      .apps-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0 10px;
      }
      .apps-head h2 {
        font-size: 14px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      .tile {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px 8px;
        text-align: center;
        min-height: 82px;
        display: grid;
        place-items: center;
        gap: 6px;
      }
      .tile:active {
        background: var(--surface-2);
      }
      .tile b {
        font-size: 26px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--surface-2);
        color: var(--text);
      }
      .tile span {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
        grid-column: 1 / -1;
        padding: 8px 0;
      }
      .list {
        display: grid;
        gap: 6px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border-radius: 12px;
        padding: 6px 6px 6px 12px;
      }
      .item .name {
        flex: 1;
        min-width: 0;
      }
      .item .name div {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item .name small {
        color: var(--muted);
        font-size: 12px;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item button {
        background: var(--surface-2);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .star.on {
        color: #ffc940;
      }
      #filter {
        width: 100%;
        margin-bottom: 10px;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        max-width: calc(100% - 32px);
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <span id="device">Conectando…</span>
      <button
        class="icon-btn"
        id="toggle-connect"
        aria-label="Conectar a outro aparelho"
      >
        IP
      </button>
    </header>

    <form id="connect">
      <input
        id="host"
        type="text"
        inputmode="url"
        placeholder="IP do aparelho, ex.: 192.168.0.50"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button class="primary" type="submit">Conectar</button>
    </form>

    <nav>
      <button class="active" data-tab="remote">Controle</button>
      <button data-tab="apps">Apps</button>
    </nav>

    <section id="tab-remote">
      <div class="row r4">
        <button class="key power" data-key="power" aria-label="Ligar/desligar">
          ⏻
        </button>
        <button class="key" data-key="back" aria-label="Voltar">↩</button>
        <button class="key" data-key="home" aria-label="Início">⌂</button>
        <button class="key" data-key="menu" aria-label="Menu">☰</button>
      </div>

      <div class="dpad">
        <button class="key" data-key="up" data-repeat aria-label="Cima">
          ▲
        </button>
        <button class="key" data-key="left" data-repeat aria-label="Esquerda">
          ◀
        </button>
        <button class="key" data-key="ok" aria-label="OK">OK</button>
        <button class="key" data-key="right" data-repeat aria-label="Direita">
          ▶
        </button>
        <button class="key" data-key="down" data-repeat aria-label="Baixo">
          ▼
        </button>
      </div>

      <div class="rockers">
        <div class="rocker">
          <button
            class="key"
            data-key="volup"
            data-repeat
            aria-label="Volume +"
          >
            +
          </button>
          <span>VOL</span>
          <button
            class="key"
            data-key="voldown"
            data-repeat
            aria-label="Volume -"
          >
            −
          </button>
        </div>
        <div class="row" style="margin: 0; grid-template-rows: 1fr 1fr">
          <button class="key" data-key="mute" aria-label="Mudo">
            ×<small>mudo</small>
          </button>
          <button class="key" data-key="recents" aria-label="Apps recentes">
            ❐<small>recentes</small>
          </button>
        </div>
        <div class="rocker">
          <button class="key" data-key="chup" data-repeat aria-label="Canal +">
            ▴
          </button>
          <span>CANAL</span>
          <button
            class="key"
            data-key="chdown"
            data-repeat
            aria-label="Canal -"
          >
            ▾
          </button>
        </div>
      </div>

      <div class="row r5">
        <button class="key" data-key="prev" aria-label="Anterior">
          ⏮&#xFE0E;
        </button>
        <button
          class="key"
          data-key="rewind"
          data-repeat
          aria-label="Retroceder"
        >
          ◀◀
        </button>
        <button class="key" data-key="playpause" aria-label="Play/Pause">
          ⏯&#xFE0E;
        </button>
        <button class="key" data-key="forward" data-repeat aria-label="Avançar">
          ▶▶
        </button>
        <button class="key" data-key="next" aria-label="Próximo">
          ⏭&#xFE0E;
        </button>
      </div>

      <form class="typing" id="typing">
        <input
          id="text"
          placeholder="Digitar na TV (busca, senha Wi-Fi…)"
          autocomplete="off"
          enterkeyhint="send"
        />
        <button
          class="key"
          type="button"
          data-key="del"
          data-repeat
          aria-label="Apagar"
        >
          ⌫
        </button>
        <button class="key" type="button" data-key="enter" aria-label="Enter">
          ↵
        </button>
      </form>

      <div class="row r3">
        <button class="key" data-key="search" aria-label="Busca">
          ⌕<small>busca</small>
        </button>
        <button class="key" data-key="settings" aria-label="Configurações">
          ⚙<small>ajustes</small>
        </button>
        <button class="key" data-key="info" aria-label="Info">
          ⓘ<small>info</small>
        </button>
      </div>
    </section>

    <section id="tab-apps" hidden>
      <div class="apps-head"><h2>Favoritos</h2></div>
      <div class="grid" id="favorites"></div>
      <div class="apps-head">
        <h2>Todos os apps</h2>
        <button class="icon-btn" id="reload-apps">Atualizar</button>
      </div>
      <input id="filter" placeholder="Filtrar apps" autocomplete="off" />
      <div class="list" id="all-apps"></div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const KNOWN = {
        "com.netflix.ninja": "Netflix",
        "com.netflix.mediaclient": "Netflix",
        "com.google.android.youtube.tv": "YouTube",
        "com.google.android.youtube": "YouTube",
        "com.globo.globotv": "Globoplay",
        "com.amazon.amazonvideo.livingroom": "Prime Video",
        "com.disney.disneyplus": "Disney+",
        "com.hbo.hbonow": "Max",
        "com.wbd.stream": "Max",
        "com.spotify.tv.android": "Spotify",
        "com.spotify.music": "Spotify",
        "com.android.vending": "Play Store",
        "com.android.tv.settings": "Ajustes",
        "com.android.settings": "Ajustes",
        "org.videolan.vlc": "VLC",
        "com.google.android.tvlauncher": "Launcher Google TV",
        "com.google.android.apps.tv.launcherx": "Google TV",
        "com.twitch.android.app": "Twitch",
        "tv.pluto.android": "Pluto TV",
        "com.apple.atve.androidtv.appletv": "Apple TV",
        "com.paramountplus.ott": "Paramount+",
      };

      const store = {
        get(key, fallback) {
          try {
            const v = localStorage.getItem(key);
            return v === null ? fallback : JSON.parse(v);
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch {}
        },
      };

      const hashToken = new URLSearchParams(location.hash.slice(1)).get("t");
      if (hashToken) store.set("token", hashToken);
      const token = hashToken || store.get("token", "");
      // Keep the token in the address so "Add to Home Screen" saves a working
      // link: on iOS the home-screen app does not share Safari's storage.
      if (token && !hashToken) {
        history.replaceState(
          null,
          "",
          `${location.pathname}#t=${encodeURIComponent(token)}`,
        );
      }

      const $ = (id) => document.getElementById(id);
      let toastTimer;
      function toast(message) {
        $("toast").textContent = message;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => $("toast").classList.remove("show"),
          2600,
        );
      }

      async function api(method, path, body) {
        const response = await fetch(path, {
          method,
          headers: { "x-token": token, "content-type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401)
          throw new Error(
            "Código de acesso ausente: abra o link completo (com #t=…) que aparece no Terminal.",
          );
        if (!response.ok)
          throw new Error(friendly(data.error || `Erro ${response.status}`));
        return data;
      }

      function friendly(message) {
        if (/unauthorized|authenticate/i.test(message))
          return "Autorize a depuração no aviso que aparece na TV.";
        if (
          /offline|not found|no devices|closed|refused|timed out|failed to connect|cannot connect/i.test(
            message,
          )
        )
          return "O box não respondeu. Ele está ligado e no mesmo Wi-Fi?";
        return message;
      }

      function setStatus(state, label) {
        $("dot").className = "dot " + state;
        $("device").textContent = label;
      }

      async function refreshStatus() {
        try {
          const s = await api("GET", "/api/status");
          lastStatusError = "";
          const name =
            [s.manufacturer, s.model].filter(Boolean).join(" ") || "Aparelho";
          setStatus(
            "on",
            `${name}${s.android ? " · Android " + s.android : ""}`,
          );
        } catch (error) {
          const offline = error instanceof TypeError;
          setStatus(
            "off",
            offline ? "Sem contato com o computador" : "Desconectado",
          );
          const message = offline
            ? "O servidor no computador está rodando? O Terminal precisa ficar aberto."
            : error.message;
          if (message !== lastStatusError) toast(message);
          lastStatusError = message;
          if (!offline) $("connect").classList.add("open");
        }
      }
      let lastStatusError = "";

      // Re-check when the phone comes back to the page and every 20 s, so
      // the header reflects a dropped or restored connection.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshStatus();
      });
      setInterval(() => {
        if (!document.hidden) refreshStatus();
      }, 20000);

      // Buttons: tap sends once; data-repeat keeps sending while held.
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      async function press(key) {
        if (navigator.vibrate) navigator.vibrate(8);
        try {
          await api("POST", "/api/key", { key });
        } catch (error) {
          toast(error.message);
          throw error;
        }
      }

      for (const button of document.querySelectorAll("[data-key]")) {
        let held = false;
        button.addEventListener("pointerdown", async (event) => {
          event.preventDefault();
          held = true;
          button.classList.add("pressed");
          try {
            await press(button.dataset.key);
            if (!("repeat" in button.dataset)) return;
            await sleep(350);
            while (held) {
              await press(button.dataset.key);
              await sleep(60);
            }
          } catch {}
        });
        const release = () => {
          held = false;
          button.classList.remove("pressed");
        };
        button.addEventListener("pointerup", release);
        button.addEventListener("pointerleave", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("contextmenu", (e) => e.preventDefault());
      }

      $("typing").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = $("text").value;
        if (!text.trim()) return;
        try {
          await api("POST", "/api/text", { text });
          $("text").value = "";
        } catch (error) {
          toast(error.message);
        }
      });

      $("toggle-connect").addEventListener("click", () =>
        $("connect").classList.toggle("open"),
      );
      $("host").value = store.get("host", "");
      $("connect").addEventListener("submit", async (event) => {
        event.preventDefault();
        // Brazilian keyboards may only offer a comma; accept it as a dot.
        const host = $("host").value.replace(/,/g, ".").replace(/\s/g, "");
        $("host").value = host;
        if (!host) return;
        setStatus("", "Conectando…");
        try {
          await api("POST", "/api/connect", { host });
          store.set("host", host);
          $("connect").classList.remove("open");
          await refreshStatus();
        } catch (error) {
          setStatus("off", "Desconectado");
          toast(error.message);
        }
      });

      // Tabs
      for (const tab of document.querySelectorAll("nav button")) {
        tab.addEventListener("click", () => {
          for (const t of document.querySelectorAll("nav button"))
            t.classList.toggle("active", t === tab);
          $("tab-remote").hidden = tab.dataset.tab !== "remote";
          $("tab-apps").hidden = tab.dataset.tab !== "apps";
          if (tab.dataset.tab === "apps" && apps.length === 0) loadApps();
        });
      }

      // Apps and favorites
      let apps = [];
      let favorites = store.get("favorites", []);

      function labelFor(pkg) {
        const fav = favorites.find((f) => f.pkg === pkg);
        if (fav && fav.label) return fav.label;
        if (KNOWN[pkg]) return KNOWN[pkg];
        const last =
          pkg
            .split(".")
            .filter(
              (p) => !["com", "br", "tv", "android", "app", "org"].includes(p),
            )
            .pop() || pkg;
        return last.charAt(0).toUpperCase() + last.slice(1);
      }

      async function launch(pkg) {
        if (navigator.vibrate) navigator.vibrate(12);
        try {
          await api("POST", "/api/launch", { package: pkg });
          toast(`Abrindo ${labelFor(pkg)}…`);
        } catch (error) {
          toast(error.message);
        }
      }

      function toggleFavorite(pkg) {
        if (favorites.some((f) => f.pkg === pkg))
          favorites = favorites.filter((f) => f.pkg !== pkg);
        else favorites.push({ pkg, label: labelFor(pkg) });
        store.set("favorites", favorites);
        render();
      }

      function renameFavorite(pkg) {
        const fav = favorites.find((f) => f.pkg === pkg);
        const label = prompt("Nome do atalho", fav.label);
        if (label === null) return;
        fav.label = label.trim() || labelFor(pkg);
        store.set("favorites", favorites);
        render();
      }

      function el(tag, props = {}, children = []) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      function render() {
        const favGrid = $("favorites");
        favGrid.replaceChildren(
          ...(favorites.length
            ? favorites.map((f) => {
                const tile = el("button", { className: "tile" }, [
                  el("b", { textContent: f.label.charAt(0).toUpperCase() }),
                  el("span", { textContent: f.label }),
                ]);
                tile.addEventListener("click", () => launch(f.pkg));
                let timer;
                tile.addEventListener("pointerdown", () => {
                  timer = setTimeout(() => renameFavorite(f.pkg), 600);
                });
                for (const ev of ["pointerup", "pointerleave", "pointercancel"])
                  tile.addEventListener(ev, () => clearTimeout(timer));
                tile.addEventListener("contextmenu", (e) => e.preventDefault());
                return tile;
              })
            : [
                el("div", {
                  className: "empty",
                  textContent:
                    "Toque na ★ de um app abaixo para fixá-lo aqui. Segure um atalho para renomear.",
                }),
              ]),
        );

        const query = $("filter").value.trim().toLowerCase();
        const shown = apps.filter(
          (pkg) =>
            !query ||
            pkg.toLowerCase().includes(query) ||
            labelFor(pkg).toLowerCase().includes(query),
        );
        $("all-apps").replaceChildren(
          ...(shown.length
            ? shown.map((pkg) => {
                const isFav = favorites.some((f) => f.pkg === pkg);
                const star = el("button", {
                  className: "star" + (isFav ? " on" : ""),
                  textContent: isFav ? "★" : "☆",
                  ariaLabel: "Favoritar",
                });
                star.addEventListener("click", () => toggleFavorite(pkg));
                const open = el("button", { textContent: "Abrir" });
                open.addEventListener("click", () => launch(pkg));
                return el("div", { className: "item" }, [
                  el("div", { className: "name" }, [
                    el("div", { textContent: labelFor(pkg) }),
                    el("small", { textContent: pkg }),
                  ]),
                  star,
                  open,
                ]);
              })
            : [
                el("div", {
                  className: "empty",
                  textContent: apps.length
                    ? "Nenhum app encontrado."
                    : "Carregando…",
                }),
              ]),
        );
      }

      async function loadApps() {
        try {
          apps = (await api("GET", "/api/apps")).apps;
        } catch (error) {
          toast(error.message);
        }
        render();
      }

      $("filter").addEventListener("input", render);
      $("reload-apps").addEventListener("click", loadApps);

      render();
      refreshStatus();
    </script>
  </body>
</html>
