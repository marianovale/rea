<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Minha TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen">
    <header id="top">
      <div id="name"></div>
      <div id="right">
        <span id="root-badge" class="badge" hidden></span>
        <div id="clock">
          <div id="time"></div>
          <div id="date"></div>
        </div>
      </div>
    </header>

    <main id="content">
      <section id="favorites-section">
        <h2>Favoritos</h2>
        <div id="favorites" class="row"></div>
      </section>
      <section id="apps-section">
        <h2>Todos os apps</h2>
        <div id="apps" class="grid"></div>
      </section>
      <div id="message" hidden></div>
    </main>

    <footer id="hints">
      <span><b>OK</b> abrir</span>
      <span><b>Segure OK</b> ou <b class="red">●</b> fixar nos favoritos</span>
      <span><b class="green">●</b> recarregar</span>
    </footer>
    <div id="toast" hidden></div>
  </div>

  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
