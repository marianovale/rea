name: LG TV

on:
  push:
    branches: [main]
    paths: ["lgtv/**", ".github/workflows/lgtv.yml"]
  pull_request:
    paths: ["lgtv/**", ".github/workflows/lgtv.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipk:
    name: Minha TV (IPK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "lgtv/**/*.test.mjs"
      - run: sh -n lgtv/install.sh && sh -n lgtv/install-dev.sh && sh -n lgtv/pull-home.sh && sh -n lgtv/tv/autostart.sh && sh -n lgtv/tv/home.sh
      - run: node lgtv/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: minha-tv-ipk
          path: lgtv/dist/*.ipk
          if-no-files-found: error
