name: UniTV

on:
  push:
    branches: [main]
    paths: ["unitv/**", ".github/workflows/unitv.yml"]
  pull_request:
    paths: ["unitv/**", ".github/workflows/unitv.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    name: Phone remote (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "unitv/**/*.test.mjs"

  box:
    name: Box app (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unitv/box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The secret holds a base64 keystore so every build is signed with the
      # same key and installs over the previous one. See unitv/README.md.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UNITV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/unitv.keystore"
            echo "UNITV_KEYSTORE=$RUNNER_TEMP/unitv.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::UNITV_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi
      # Says whether a signing failure is the password or the file format,
      # without printing either.
      - name: Check signing key
        if: env.UNITV_KEYSTORE != ''
        env:
          UNITV_KEYSTORE_PASSWORD: ${{ secrets.UNITV_KEYSTORE_PASSWORD }}
        run: |
          password="$(printf '%s' "$UNITV_KEYSTORE_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$password" ]; then
            echo "::error::UNITV_KEYSTORE_PASSWORD is empty."
            exit 1
          fi
          if ! PASS="$password" openssl pkcs12 -in "$UNITV_KEYSTORE" -noout -passin env:PASS 2>/dev/null \
             && ! PASS="$password" openssl pkcs12 -legacy -in "$UNITV_KEYSTORE" -noout -passin env:PASS 2>/dev/null; then
            echo "::error::UNITV_KEYSTORE_PASSWORD does not open UNITV_KEYSTORE_BASE64 (wrong password, or the keystore was not pasted whole)."
            exit 1
          fi
          if ! keytool -list -keystore "$UNITV_KEYSTORE" -storepass "$password" -alias unitv >/dev/null; then
            echo "::error::The password is right, but Java cannot read the keystore or it has no 'unitv' key. See unitv/README.md for how to create it."
            exit 1
          fi
          echo "Signing key OK."
      - name: Test and build
        env:
          UNITV_KEYSTORE_PASSWORD: ${{ secrets.UNITV_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      # Shows which key signed the APK, so a switch of keys is visible.
      - name: Show signing certificate
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unitv-box-apk
          path: unitv/box/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
